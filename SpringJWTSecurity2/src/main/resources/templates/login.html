<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container{
   margin-top: 50px;
}
.row {
   width: 350px;
   margin: 0px auto;
}
</style>
</head>
<body>
  <div class="container">
    <div class="row">
      <h3 class="text-center">Login</h3>
      <!-- <form method="post" action="/login"> -->
        <table class="table">
          <tbody>
            <tr>
              <td width=20%>ID</td>
              <td width=80%>
                <input type=text id="username"
                  class="input-sm" size=20>
              </td>
            </tr>
            <tr>
              <td width=20%>PW</td>
              <td width=80%>
                <input type=password id="password"
                  class="input-sm" size=20>
              </td>
            </tr>
            <tr>
             <td colspan="2" class="text-center">
               <button class="btn-sm btn-warning" type="button" onclick="login()">로그인</button>
               <button class="btn-sm btn-warning" type="button"
                 onclick="javascript:history.back()"
               >취소</button>
             </td>
            </tr>
          </tbody>
        </table>
      <!-- </form> -->
    </div>
  </div>
  <script>
    async function login()
    {
    	const p=new URLSearchParams();
    	p.append("username",username.value)
    	p.append("password",password.value)
    	
    	const res=await fetch("/member/login",{
    		method:"POST",
    		body:p
    	})
    	
    	const token=await res.text()
    	localStorage.setItem("token",token)
    	location.href="/"
    }
  </script>
</body>
</html>
