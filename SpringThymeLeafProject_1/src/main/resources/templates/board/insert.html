<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container{
   margin-top: 50px;
}
.row{
  margin: 0px auto;
  width: 900px;
}
h3{
  text-align: center;
}
</style>
</head>
<body>
  <div class="container">
    <h3 class="text-center">글쓰기</h3>
    <div class="row">
      <form method="post" action="/board/insert_ok">
       <table class="table">
         <tr>
           <th class="text-right" width=10%>이름</th>
           <td width=90%>
            <input type=text name=name size=20 class="input-sm"
             required>
           </td>
         </tr>
         <tr>
           <th class="text-right" width=10%>제목</th>
           <td width=90%>
            <input type=text name=subject size=60 class="input-sm"
             required>
           </td>
         </tr>
         <tr>
           <th class="text-right" width=10%>내용</th>
           <td width=90%>
            <textarea rows="10" cols="60" name=content required></textarea>
           </td>
         </tr>
         
         <tr>
           <th class="text-right" width=10%>비밀번호</th>
           <td width=90%>
            <input type="password" name=pwd class="input-sm"
             required>
           </td>
         </tr>
         <tr>
           <td colspan="2" class="text-center">
             <button class="btn-sm btn-warning" type="submit">글쓰기</button>
             <button type="button" class="btn-sm btn-warning"
               onclick="javascript:history.back()"
             >취소</button>
           </td>
         </tr>
       </table>
      </form>
    </div>
  </div>
</body>
</html>
