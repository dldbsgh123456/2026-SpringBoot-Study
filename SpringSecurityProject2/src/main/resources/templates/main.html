<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container{
   margin-top: 50px;
}
.row{
   width: 350px;
   margin: 0px auto;
}
</style>
</head>
<body>
  <div class="container">
    <div class="row">
      <h3 class="text-center">메인 페이지</h3>
        <table class="table">
          <tbody>
            <tr sec:authorize="isAnonymous()">
              <td class="text-center">
                <a href="/login" class="btn btn-sm btn-danger">로그인</a>
              </td>
              <td class="text-center">
                <a href="/join" class="btn btn-sm btn-success">회원가입</a>
              </td>
            </tr>
            <tr sec:authorize="isAuthenticated()">
              <td colspan="2" class="text-center">
                <strong sec:authentication="name"></strong>&nbsp;환영합니다
              </td>
            </tr>
            <tr sec:authorize="hasRole('USER')">
              <td colspan="2" class="text-center">
                <a href="/user" class="btn btn-sm btn-info">마이페이지</a>
              </td>
            </tr>
             <tr sec:authorize="hasRole('ADMIN')">
              <td colspan="2" class="text-center">
                <a href="/admin" class="btn btn-sm btn-info">관리자페이지</a>
              </td>
             </tr>
             <tr sec:authorize="isAuthenticated()">
              <td colspan="2" class="text-center">
                <form method="post" action="/logout">
                  <button type=submit class="btn btn-sm btn-warning">로그아웃</button>
                </form>
              </td>
             </tr>
             <tr>
               <td colspan="2" class="text-center">
                 <a href="/all" class="btn btn-sm btn-primary">모든 사용자</a>
               </td>
             </tr>
          </tbody>
        </table>
    </div>
  </div>
</body>
</html>
